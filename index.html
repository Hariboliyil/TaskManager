<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Task Manager</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><main class="app-shell">
<header class="topbar"><div><p class="eyebrow">WORKSPACE</p><h1>Task Manager</h1></div></header><nav class="tabs"><button class="tab" data-tab="tasks" type="button">Recurring Tasks</button><button class="tab active" data-tab="tat" type="button">TAT</button></nav>
<section id="tasksPanel" hidden><section class="overview"><article><span class="metric-label">Total tasks</span><strong id="totalCount">1</strong></article><article><span class="metric-label">Pending</span><strong id="pendingCount">1</strong></article><article><span class="metric-label">Completed</span><strong id="completedCount">0</strong></article><article class="next-task"><span class="metric-label">Next due</span><strong id="nextDue">28 Sep</strong><small>BD Master</small></article></section><section class="tasks-card"><div class="card-heading"><div><p class="eyebrow">YOUR SCHEDULE</p><h2>Tasks</h2></div><label class="search"><span>⌕</span><input id="taskSearch" type="search" placeholder="Search tasks"></label></div><div class="recurring-filters"><label>Task<select id="taskFilter"><option value="">All tasks</option></select></label><label>Due date<input id="dueDateFilter" type="date"></label><div class="slicer"><span>Done:</span><button class="done-slicer active" data-done="All" type="button">All</button><button class="done-slicer" data-done="Yes" type="button">Done</button><button class="done-slicer" data-done="No" type="button">Not done</button></div><div class="slicer"><span>Status:</span><button class="task-status-slicer active" data-task-status="All" type="button">All</button><button class="task-status-slicer" data-task-status="Pending" type="button">Pending</button><button class="task-status-slicer" data-task-status="Completed" type="button">Completed</button></div><button class="secondary reset-filters" id="resetTaskFilters" type="button">Reset filters</button></div><div class="table-wrap"><table class="task-table"><thead><tr><th><button id="addTaskRow" class="add-row" type="button">+</button>Task</th><th>Frequency</th><th>Due date</th><th>Done</th><th>Status</th><th>Remarks</th><th></th></tr></thead><tbody id="taskRows"></tbody></table></div></section></section>
<section id="tatPanel"><section class="tasks-card tat-card"><div class="card-heading"><div><p class="eyebrow">TASK ACTION TRACKER</p><h2>TAT</h2></div><div class="tat-controls"><div class="slicer"><span>Class:</span><button class="slicer-button active" data-class="All" type="button">All</button><button class="slicer-button" data-class="Timepass" type="button">Timepass</button><button class="slicer-button" data-class="ASAP" type="button">ASAP</button><button class="slicer-button" data-class="R &amp; D" type="button">R &amp; D</button><button class="slicer-button" data-class="FU" type="button">FU</button><button class="slicer-button" data-class="-" type="button">-</button></div><div class="slicer"><span>Status:</span><button class="status-slicer-button active" data-status="All" type="button">All</button><button class="status-slicer-button" data-status="Pending" type="button">Pending</button><button class="status-slicer-button" data-status="In progress" type="button">In progress</button><button class="status-slicer-button" data-status="Completed" type="button">Completed</button></div><div class="export-actions"><button class="secondary" id="exportFull" type="button">Export full list</button><button class="secondary" id="exportFiltered" type="button">Export filtered</button></div></div></div><div class="table-wrap"><table class="tat-table"><thead><tr><th><button id="addTatRow" class="add-row" type="button">+</button>Date</th><th>Task description</th><th>What to do</th><th>Class</th><th>Status</th><th></th></tr></thead><tbody id="tatRows"></tbody></table><p class="empty-state" id="tatFilterEmpty" hidden>No saved TAT entries match these filters.</p></div></section></section>
</main><datalist id="actionSuggestions"></datalist><datalist id="taskSuggestions"></datalist><script src="app.js"></script></body></html>
